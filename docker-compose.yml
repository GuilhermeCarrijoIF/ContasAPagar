services:
  mysql:
    image: mysql:8.4
    container_name: mysql-contas-pagar-receber
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: contas_pagar_receber
    ports:
      - "3306:3306"
    volumes:
      - mysql_contas_data:/var/lib/mysql

volumes:
  mysql_contas_data:
